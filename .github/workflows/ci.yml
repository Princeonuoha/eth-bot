name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:

  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests
        env:
          BINANCE_API_KEY: dummy_key_for_ci
          BINANCE_API_SECRET: dummy_secret_for_ci
          TESTNET: "true"
          LOG_DIR: /tmp/test-logs
          TAKE_PROFIT_PCT: "0"
          ATR_TP_MULTIPLIER: "1.5"
          ATR_TP_MIN_PCT: "0.8"
          ATR_TP_MAX_PCT: "4.0"
          EMA_SLOPE_MIN_PCT: "-0.1"
          MAX_VOLUME_RATIO: "1.5"
          ATR_MULTIPLIER: "2.0"
          LIMIT_SELL_BUFFER_PCT: "0.3"
          LIMIT_SELL_TIMEOUT_SECONDS: "30"
          TRAILING_ACTIVATION_PCT: "1.0"
          TRAILING_STOP_PCT: "0.8"
        run: pytest tests/ -v --tb=short

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t eth-bot:ci .

      - name: Smoke test image
        run: |
          docker run --rm \
            -e BINANCE_API_KEY=dummy \
            -e BINANCE_API_SECRET=dummy \
            -e TESTNET=true \
            -e LOG_DIR=/tmp/logs \
            -e TAKE_PROFIT_PCT=0 \
            -e ATR_TP_MULTIPLIER=1.5 \
            -e ATR_TP_MIN_PCT=0.8 \
            -e ATR_TP_MAX_PCT=4.0 \
            -e EMA_SLOPE_MIN_PCT=-0.1 \
            -e MAX_VOLUME_RATIO=1.5 \
            -e ATR_MULTIPLIER=2.0 \
            -e LIMIT_SELL_BUFFER_PCT=0.3 \
            -e LIMIT_SELL_TIMEOUT_SECONDS=30 \
            -e TRAILING_ACTIVATION_PCT=1.0 \
            -e TRAILING_STOP_PCT=0.8 \
            eth-bot:ci \
            python -c "from app.services.trader import Trader; print('Import OK')"

  safety:
    name: Safety Check
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Ensure .env.example defaults to testnet
        run: |
          if grep -q "^TESTNET=false" .env.example; then
            echo "❌ DANGER: .env.example has TESTNET=false"
            exit 1
          fi
          echo "✅ TESTNET=true in .env.example"

      - name: Ensure .env is gitignored
        run: |
          if ! grep -q "^\.env$" .gitignore; then
            echo "❌ .env is NOT in .gitignore"
            exit 1
          fi
          echo "✅ .env is gitignored"

      - name: Check for hardcoded secrets
        run: |
          if grep -rn "BINANCE_API_KEY=" --include="*.py" \
            | grep -v "dummy" \
            | grep -v "your_binance" \
            | grep -v "os.environ" \
            | grep -v "#"; then
            echo "❌ Possible API key found in source files"
            exit 1
          fi
          echo "✅ No hardcoded API keys found"
