name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install dev tools
        run: pip install pytest ruff

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests
        env:
          BINANCE_API_KEY: dummy_key_for_ci
          BINANCE_API_SECRET: dummy_secret_for_ci
          TESTNET: "true"
        run: pytest tests/ -v
